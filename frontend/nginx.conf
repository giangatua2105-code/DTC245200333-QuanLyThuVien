pid /tmp/nginx.pid;
error_log /logs/nginx-error.log warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 server_tokens off;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 access_log /logs/nginx-access.log;
 limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
 server {
  listen 8080;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  client_max_body_size 20k;
  location = /metrics { return 404; }
  root /usr/share/nginx/html;
  location /api/ {
   limit_req zone=auth burst=30 nodelay;
   proxy_pass http://app:3000;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header X-Forwarded-Proto $scheme;
  }
  location = /health { proxy_pass http://app:3000; }
  location / { try_files $uri $uri/ /index.html; }

 }
 server { listen 8081; access_log off; location = /stub_status { stub_status; } location / { return 404; } }
}
